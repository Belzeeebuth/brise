<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e3e1db" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
  <title>Brise</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Brise">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/phone.css">
  <script src="/i18n.js" defer></script>
  <script src="/common.js" defer></script>
  <script src="/phone.js" defer></script>
</head>
<body class="phone">
  <div class="wall" aria-hidden="true"></div>
  <div id="boot" class="boot"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 25.5H39a6.5 6.5 0 1 0-6.5-6.5"/><path d="M49.5 38.5H25a6.5 6.5 0 1 0 6.5 6.5"/></g></svg><span class="spinner"></span></div>
  <div id="shell" hidden>
    <header class="phone-top">
      <span class="brand"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 25.5H39a6.5 6.5 0 1 0-6.5-6.5"/><path d="M49.5 38.5H25a6.5 6.5 0 1 0 6.5 6.5"/></g></svg><span>Brise</span></span>
      <span id="status-chip" class="chip status-chip" hidden><span class="dot"></span><span id="status-text"></span></span>
      <button class="icon-button" data-action="help" data-i18n-label="action.help" data-i18n-title="action.help"><span data-icon="help"></span></button>
    </header>
    <main class="phone-main">
      <section id="pair-screen" class="screen pair-layout" hidden>
        <div class="hero card">
          <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 25.5H39a6.5 6.5 0 1 0-6.5-6.5"/><path d="M49.5 38.5H25a6.5 6.5 0 1 0 6.5 6.5"/></g></svg>
          <h1 id="pair-title" data-i18n="phone.pair.title"></h1>
          <p id="pair-hero" data-i18n="phone.pair.hero"></p>
        </div>
        <form id="pair-form" class="card form-card">
          <p id="pair-note" class="note" hidden><span data-icon="info"></span><span id="pair-note-text"></span></p>
          <p data-i18n="phone.pair.text"></p>
          <label class="field" id="pair-code-field" hidden><span class="field-label" data-i18n="phone.manual.code"></span><input id="pair-code-input" class="input large code-input" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC-DEF"></label>
          <label class="field"><span class="field-label" data-i18n="phone.pair.name"></span><input id="device-name" class="input large" maxlength="48" autocomplete="off" required></label>
          <button class="button primary large block" type="submit"><span data-i18n="phone.pair.submit"></span></button>
        </form>
      </section>
      <section id="waiting-screen" class="screen wait card" hidden>
        <span class="wait-ring"><span data-icon="laptop"></span></span>
        <h1 data-i18n="phone.wait.title"></h1>
        <p data-i18n="phone.wait.text"></p>
        <div id="pair-code" class="code"></div>
      </section>
      <section id="workspace" class="screen workspace" hidden>
        <div class="send-column">
          <button id="send-card" class="send-card" type="button">
            <span class="send-icon"><span data-icon="upload"></span></span>
            <span class="send-copy"><strong data-i18n="phone.send.title"></strong><span data-i18n="phone.send.text"></span></span>
          </button>
          <button id="send-text" class="button secondary large block text-button" type="button"><span data-icon="text"></span><span data-i18n="phone.text.button"></span></button>
          <div id="uploads" class="uploads"></div>
        </div>
        <div class="files-column card">
          <div class="files-head"><h2><span data-i18n="phone.files.title"></span><span id="file-count" class="count" hidden></span></h2></div>
          <div id="file-list" class="rows"></div>
        </div>
      </section>
      <section id="error-screen" class="screen wait card" hidden>
        <span class="wait-ring error"><span data-icon="alert"></span></span>
        <h1 data-i18n="phone.error.title"></h1>
        <p id="error-text"></p>
        <button class="button secondary large" data-action="refresh"><span data-icon="refresh"></span><span data-i18n="action.retry"></span></button>
      </section>
    </main>
  </div>
  <input type="file" id="file-picker" multiple hidden>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialog" class="modal">
    <div class="modal-head"><h2 id="dialog-title"></h2><button class="icon-button" data-close data-i18n-label="action.close"><span data-icon="x"></span></button></div>
    <div id="dialog-body" class="modal-body"></div>
  </dialog>
</body>
</html>
