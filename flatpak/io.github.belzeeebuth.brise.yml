id: io.github.belzeeebuth.brise
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.golang
command: brise
finish-args:
  # Le téléphone se connecte au serveur intégré, sur le réseau local ou via Internet.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Icône dans la barre système et notifications.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  # Les fichiers reçus vont dans Téléchargements/Brise. Les fichiers à partager
  # arrivent par le portail (sélecteur, glisser-déposer, « Ouvrir avec »).
  - --filesystem=xdg-download
  # « Afficher dans le dossier » ouvre le gestionnaire de fichiers.
  - --talk-name=org.freedesktop.FileManager1
  # Point d'accès Wi-Fi : Brise crée et retire son profil par D-Bus.
  - --system-talk-name=org.freedesktop.NetworkManager
modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  # Mode Internet : tunnel Cloudflare, compilé depuis ses sources (Apache-2.0).
  - name: cloudflared
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        GOFLAGS: -mod=vendor
        GOPROXY: 'off'
        GOTOOLCHAIN: local
        CGO_ENABLED: '0'
        GOCACHE: /run/build/cloudflared/go-cache
        GOPATH: /run/build/cloudflared/go
    build-commands:
      - go build -trimpath -ldflags "-s -w -X main.Version=2026.10.0" -o /app/bin/cloudflared ./cmd/cloudflared
      - install -Dm644 LICENSE /app/share/licenses/io.github.belzeeebuth.brise/cloudflared-LICENSE
    sources:
      - type: git
        url: https://github.com/cloudflare/cloudflared.git
        tag: 2026.10.0
        commit: 18cdfe0a6fc7b72a0702d255a1f984e776ce0498
      # Modules Go, produits par flatpak-go-mod depuis go.mod (voir flatpak/README.md).
      - cloudflared/sources.json
  - name: brise
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/brise/cargo
    build-commands:
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml --verbose
      - cargo --offline build --release --manifest-path src-tauri/Cargo.toml --no-default-features --features portal-dialogs,tauri/custom-protocol
      - install -Dm755 src-tauri/target/release/brise /app/bin/brise
      - install -Dm644 flatpak/io.github.belzeeebuth.brise.desktop /app/share/applications/io.github.belzeeebuth.brise.desktop
      - install -Dm644 src-tauri/io.github.belzeeebuth.brise.metainfo.xml /app/share/metainfo/io.github.belzeeebuth.brise.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.belzeeebuth.brise.png
      - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.belzeeebuth.brise.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.belzeeebuth.brise.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.belzeeebuth.brise.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.belzeeebuth.brise.png
      - install -Dm644 ui/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.belzeeebuth.brise.svg
    sources:
      - type: git
        url: https://github.com/Belzeeebuth/brise.git
        tag: v0.5.1
      - cargo-sources.json
