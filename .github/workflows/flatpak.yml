name: Flatpak

on:
  push:
    branches: [main]
    paths: ['flatpak/**', 'src-tauri/Cargo.lock', '.github/workflows/flatpak.yml']
  pull_request:
    paths: ['flatpak/**', 'src-tauri/Cargo.lock']
  workflow_dispatch:
    inputs:
      release:
        description: Tag de la release à laquelle joindre le Flatpak (facultatif)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  flatpak:
    name: Construire le Flatpak depuis ce commit
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Utiliser le code de ce commit plutôt que celui du tag
        run: |
          sed -i \
            -e 's|^      - type: git$|      - type: dir|' \
            -e 's|^        url: https://github.com/Belzeeebuth/brise.git$|        path: ..|' \
            -e 's|^        tag: v.*$|        skip: [.flatpak-builder, flatpak_app, repo, .git, src-tauri/target, node_modules, .scratch]|' \
            flatpak/io.github.belzeeebuth.brise.yml
          grep -A3 'type: dir' flatpak/io.github.belzeeebuth.brise.yml
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: Brise.flatpak
          manifest-path: flatpak/io.github.belzeeebuth.brise.yml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Joindre le Flatpak à la release
        if: inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release }}
          files: Brise.flatpak
